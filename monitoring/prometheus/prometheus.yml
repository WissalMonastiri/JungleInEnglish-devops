global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'ai-learning-assistant'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ai-learning-assistant-microservice:8082']

  - job_name: 'collaboration-room'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['collaboration-room-microservice:8083']

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-microservice:8081']

  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']
